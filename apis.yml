aid: poka
name: Poka
description: >-
  Poka is a manufacturing-focused connected worker platform that helps industrial
  and frontline teams standardize work execution across learning, daily management,
  and operations. It combines digital work instructions, on-the-job training, skills
  management, and factory-floor knowledge sharing with embedded Industrial AI. Poka
  exposes a RESTful Poka API for building integrations with third-party systems
  (MES, CMMS, LMS, QMS, ERP, BI), SCIM for automated user provisioning from identity
  providers, the Poka Automate iPaaS, and a Poka Data Lake for BI/reporting. Poka is
  part of IFS and runs regionally in the US, Canada, and EU.
